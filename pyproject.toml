[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zerocaptcha"
version = "0.1.0"
description = "The official ZeroCaptcha client: create a Turnstile task, wait for its result, read the balance and check a callback's signature."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zerocaptcha = ["py.typed"]
